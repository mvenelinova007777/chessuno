<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ChessUno — chess meets UNO, online for two</title>
    <meta
      name="description"
      content="ChessUno is a free two-player online game: chess, but every turn starts with an UNO card that decides how many moves you get."
    />
    <meta name="theme-color" content="#111827" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111827'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23f8fafc'%3E%E2%99%9E%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="ChessUno">
          <span class="brand-mark">♞</span>
          <span class="brand-text">Chess<span>Uno</span></span>
        </a>
        <div class="topbar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="bg">BG</button>
          </div>
          <button id="btn-sound" class="icon-btn" type="button" data-i18n-title="ui.sound" aria-label="Sound">
            <span class="sound-on">🔊</span><span class="sound-off">🔇</span>
          </button>
          <button id="btn-help" class="icon-btn" type="button" data-i18n-title="ui.help" aria-label="How to play">
            ?
          </button>
        </div>
      </header>

      <main>
        <!-- ── Lobby ─────────────────────────────────────────────────────── -->
        <section id="screen-lobby" class="screen">
          <div class="hero">
            <h1>Chess<span>Uno</span></h1>
            <p class="hero-sub" data-i18n="lobby.tagline"></p>
          </div>

          <div class="lobby-grid">
            <div class="panel lobby-panel">
              <label class="field-label" for="nickname" data-i18n="lobby.nickname"></label>
              <div class="input-row">
                <input
                  id="nickname"
                  type="text"
                  maxlength="16"
                  autocomplete="off"
                  spellcheck="false"
                  data-i18n-placeholder="lobby.nicknamePlaceholder"
                />
                <button id="btn-random-name" class="btn btn-ghost" type="button" data-i18n="lobby.random"></button>
              </div>

              <button id="btn-create" class="btn btn-primary btn-block" type="button" data-i18n="lobby.create"></button>

              <div class="divider"><span data-i18n="lobby.or"></span></div>

              <label class="field-label" for="join-code" data-i18n="lobby.joinTitle"></label>
              <div class="input-row">
                <input
                  id="join-code"
                  type="text"
                  class="code-input"
                  maxlength="5"
                  autocapitalize="characters"
                  autocomplete="off"
                  spellcheck="false"
                  data-i18n-placeholder="lobby.codePlaceholder"
                />
                <button id="btn-join" class="btn btn-secondary" type="button" data-i18n="lobby.join"></button>
              </div>

              <p class="fineprint" data-i18n="lobby.hint"></p>
            </div>

            <ul class="feature-list">
              <li>
                <span class="feature-icon">♟</span>
                <div>
                  <strong data-i18n="lobby.feature1.title"></strong>
                  <p data-i18n="lobby.feature1.text"></p>
                </div>
              </li>
              <li>
                <span class="feature-icon">🃏</span>
                <div>
                  <strong data-i18n="lobby.feature2.title"></strong>
                  <p data-i18n="lobby.feature2.text"></p>
                </div>
              </li>
              <li>
                <span class="feature-icon">⚡</span>
                <div>
                  <strong data-i18n="lobby.feature3.title"></strong>
                  <p data-i18n="lobby.feature3.text"></p>
                </div>
              </li>
            </ul>
          </div>

          <p class="connection-note"><span id="connection-status" class="status-dot"></span><span data-i18n="lobby.connection"></span></p>
        </section>

        <!-- ── Waiting for opponent ──────────────────────────────────────── -->
        <section id="screen-waiting" class="screen hidden">
          <div class="panel waiting-panel">
            <h2 data-i18n="waiting.title"></h2>
            <p data-i18n="waiting.share"></p>
            <div class="code-display" id="waiting-code">·····</div>
            <div class="copy-row">
              <button id="btn-copy-code" class="btn btn-secondary" type="button" data-i18n="waiting.copyCode"></button>
              <button id="btn-copy-link" class="btn btn-primary" type="button" data-i18n="waiting.copyLink"></button>
            </div>
            <div class="waiting-spinner" aria-hidden="true"></div>
            <p class="muted" data-i18n="waiting.waitingForOpponent"></p>
            <button id="btn-cancel-wait" class="btn btn-ghost" type="button" data-i18n="waiting.cancel"></button>
          </div>
        </section>

        <!-- ── Game ──────────────────────────────────────────────────────── -->
        <section id="screen-game" class="screen hidden">
          <div class="game-layout">
            <div class="board-column">
              <div class="player-strip" id="strip-opponent"></div>
              <div class="board-shell">
                <div id="board" class="board" role="grid" aria-label="Chess board"></div>
                <div id="board-banner" class="board-banner hidden"></div>
                <div id="emote-layer" class="emote-layer" aria-hidden="true"></div>
              </div>
              <div class="player-strip" id="strip-you"></div>
            </div>

            <aside class="panel side-panel">
              <div class="room-row">
                <div>
                  <span class="field-label" data-i18n="game.room"></span>
                  <div class="room-code" id="room-code">·····</div>
                </div>
                <button id="btn-copy-room" class="btn btn-ghost btn-small" type="button" data-i18n="waiting.copyLink"></button>
              </div>

              <div id="turn-bar" class="turn-bar"></div>

              <div class="card-zone">
                <div class="deck" id="deck" title="Draw pile">
                  <div class="deck-card c-blue">U</div>
                  <div class="deck-card c-red">N</div>
                  <div class="deck-card c-yellow">O</div>
                  <span class="deck-count" id="deck-count">0</span>
                </div>
                <div class="played" id="played-card"></div>
                <div class="budget" id="budget"></div>
              </div>

              <div id="revive-panel" class="revive-panel hidden">
                <label class="field-label" for="revive-select" data-i18n="game.revive.title"></label>
                <p class="muted small" data-i18n="game.revive.hint"></p>
                <select id="revive-select"></select>
                <p class="muted small" id="revive-status"></p>
              </div>

              <button id="btn-end-turn" class="btn btn-primary btn-block" type="button" data-i18n="game.endTurn"></button>

              <div class="feed" id="feed"></div>

              <div class="menu-row">
                <button id="btn-resign" class="btn btn-ghost" type="button" data-i18n="game.resign"></button>
                <button id="btn-offer-draw" class="btn btn-ghost" type="button" data-i18n="game.offerDraw"></button>
              </div>

              <div class="emote-bar" id="emote-bar"></div>
            </aside>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span data-i18n="footer.text"></span>
      </footer>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- ── Modals ───────────────────────────────────────────────────────── -->
    <div id="modal-help" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button class="modal-close" type="button" data-close="modal-help" aria-label="Close">×</button>
        <h2 data-i18n="help.title"></h2>
        <div class="modal-body help-body">
          <p data-i18n="help.intro"></p>
          <h3 data-i18n="help.setupTitle"></h3>
          <p data-i18n="help.setup"></p>
          <h3 data-i18n="help.cardsTitle"></h3>
          <ul class="help-cards">
            <li><span class="mini-card c-green">4</span><span data-i18n="help.number"></span></li>
            <li><span class="mini-card c-red">✋</span><span data-i18n="help.skip"></span></li>
            <li><span class="mini-card c-yellow">⇄</span><span data-i18n="help.swap"></span></li>
            <li><span class="mini-card c-blue">+2</span><span data-i18n="help.revive"></span></li>
          </ul>
          <h3 data-i18n="help.turnTitle"></h3>
          <p data-i18n="help.turn"></p>
          <h3 data-i18n="help.edgeTitle"></h3>
          <p data-i18n="help.edge"></p>
          <h3 data-i18n="help.disconnectTitle"></h3>
          <p data-i18n="help.disconnect"></p>
        </div>
      </div>
    </div>

    <div id="modal-promotion" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-small">
        <h2 data-i18n="promotion.title"></h2>
        <div class="promo-row" id="promo-row"></div>
      </div>
    </div>

    <div id="modal-draw" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-small">
        <h2 data-i18n="draw.title"></h2>
        <p id="draw-text"></p>
        <div class="modal-actions">
          <button id="btn-accept-draw" class="btn btn-primary" type="button" data-i18n="draw.accept"></button>
          <button id="btn-decline-draw" class="btn btn-ghost" type="button" data-i18n="draw.decline"></button>
        </div>
      </div>
    </div>

    <div id="modal-result" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-small">
        <div class="result-emoji" id="result-emoji">🏁</div>
        <h2 id="result-title"></h2>
        <p id="result-reason" class="muted"></p>
        <div class="modal-actions">
          <button id="btn-rematch" class="btn btn-primary" type="button" data-i18n="result.rematch"></button>
          <button id="btn-lobby" class="btn btn-ghost" type="button" data-i18n="result.lobby"></button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
